[project]
name = "wow-gm-web"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jinja2>=3.1,<4", "python-multipart>=0.0.20", "pymysql>=1.1,<2", "itsdangerous>=2.2,<3"]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["wowgm"]
[tool.pytest.ini_options]
testpaths = ["tests"]
